<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>2856 Mono: tinted black and white image, colour and slow zoom on hover, texts rise line by line.</f:comment>
<figure class="rc5-item">
    <div class="rc5-media"><f:render partial="Motion/Image" arguments="{file: file, settings: settings}" /></div>
    <figcaption class="rc5-overlay">
        <f:if condition="{file.title}"><span class="rc5-line"><f:if condition="{file.title}"><h3 class="rc5-title"><f:render partial="Motion/Title" arguments="{file: file, settings: settings}" /></h3></f:if></span></f:if>
        <f:if condition="{file.description}"><span class="rc5-line"><f:render partial="Motion/Text" arguments="{file: file, settings: settings}" /></span></f:if>
        <f:if condition="{settings.R5useButtonMore} == 1 && {file.link}"><span class="rc5-line"><f:render partial="Motion/More" arguments="{file: file, settings: settings}" /></span></f:if>
    </figcaption>
</figure>
</html>
