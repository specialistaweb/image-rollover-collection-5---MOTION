<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>2858 Curtain: the image splits in two halves that open and reveal a coloured panel.</f:comment>
<figure class="rc5-item">
    <div class="rc5-media">
        <span class="rc5-half"><f:render partial="Motion/Image" arguments="{file: file, settings: settings}" /></span>
        <span class="rc5-half" aria-hidden="true"><f:render partial="Motion/Image" arguments="{file: file, settings: settings}" /></span>
        <f:if condition="{file.title}"><span class="rc5-label" aria-hidden="true">{file.title -> f:format.stripTags() -> f:format.htmlspecialchars(doubleEncode: 0)}</span></f:if>
    </div>
    <figcaption class="rc5-panel">
        <f:if condition="{file.title}"><h3 class="rc5-title"><f:render partial="Motion/Title" arguments="{file: file, settings: settings}" /></h3></f:if>
        <f:render partial="Motion/Text" arguments="{file: file, settings: settings}" />
        <f:render partial="Motion/More" arguments="{file: file, settings: settings}" />
    </figcaption>
</figure>
</html>
